name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Without this a superseded run keeps its runners. That is how a hung demo job stayed
# invisible: each push cancelled nothing, so the stuck runs simply accumulated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI selects the offline SDK-free profile DELIBERATELY: seeded dev personas are refused when
# REVIEW_PROFILE is unset. The shipped image and Cloud Run both select 'gcp'.
env:
  REVIEW_PROFILE: local

jobs:
  check:
    name: lint · typecheck · test · eval (offline, no GCP SDKs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      # Install the framework-light core + dev tools from the committed lockfile, then the package
      # itself with --no-deps so the lock stays authoritative (matches pip-audit and the image).
      # The [gcp] extra is deliberately NOT installed: the gate must pass with no Google Cloud SDKs,
      # proving the local profile and the lazy-import discipline.
      - name: Install (no GCP SDKs, locked)
        run: pip install -r requirements-dev.lock && pip install -e . --no-deps

      - name: Ruff (lint + format)
        run: |
          ruff check src tests eval
          ruff format --check src tests eval

      - name: Mypy (strict)
        run: mypy src

      - name: Pytest (must pass with no Google Cloud SDKs installed)
        run: pytest -m 'not integration' -q

      - name: Eval gate (offline smoke, exit non-zero on fail)
        run: python eval/run_eval.py

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build serving image
        run: docker build -t human-review-console:ci .

  ui-audit:
    name: ui supply-chain (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: "20"
      - name: npm audit (high severity is a hard gate)
        working-directory: ui
        run: |
          npm ci
          # No exceptions. next 16.3.0 clears the sharp advisory (GHSA-f88m-g3jw-g9cj) that
          # the previous temporary carve-out existed for, so high and critical are simply a
          # hard failure again. The 2026-07-23 PostCSS advisories (GHSA-qx2v-qp2m-jg93,
          # GHSA-6g55-p6wh-862q) stay fixed for real: ui/package.json overrides postcss to
          # 8.5.22, which dedupes away the older transitive pin.
          npm audit --audit-level=high

  terraform:
    name: terraform fmt + validate (offline, no credentials)
    runs-on: ubuntu-latest
    # Validates the infra/terraform stack with no backend and no cloud credentials, so a syntax,
    # reference or formatting error fails the PR before anyone applies it. This is posture-as-code
    # validation only: it is NOT proof that VPC-SC, CMEK or Org Policy are enforced on a live
    # project, which only a real apply on a named deployment can show.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init (no backend)
        run: terraform -chdir=infra/terraform init -backend=false -input=false

      - name: Terraform fmt (check)
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate

  supply-chain:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: pip-audit (dev + gcp lockfiles)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements-dev.lock --disable-pip --no-deps
          pip-audit -r requirements-gcp.lock --disable-pip --no-deps

  ui-build:
    name: Next.js console builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install the locked console dependencies
        working-directory: ui
        run: npm ci

      - name: Type-check the console
        working-directory: ui
        run: npm run lint

      - name: Security-header contract (CSP policy module)
        working-directory: ui
        run: npm test

      - name: Build the thin console
        # npm audit alone cannot catch a UI-breaking dependency bump; only a real build can.
        working-directory: ui
        run: NEXT_TELEMETRY_DISABLED=1 npm run build

      - name: Hydration proof against the BUILT server
        # The one check that can fail on the C6a defect. It starts the artefact the step above
        # produced, fetches the served document and asserts every script tag carries the response
        # nonce; the CSP header alone is byte-identical whether the console hydrates or ships as
        # dead markup, so no header assertion can stand in for this.
        working-directory: ui
        run: npm run assert-hydratable

  demo-portability:
    name: live demo and bounded portability
    runs-on: ubuntu-latest
    # This job spawns a live API and UI and drives them through a browser, so a wedged child
    # process reads as "still running" rather than as a failure. Bounded so that shows up as
    # a red job in minutes instead of holding a runner until the six hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install locked application and demo dependencies
        run: |
          pip install -r requirements-dev.lock
          pip install -e . --no-deps
          npm ci --prefix ui
          npx --prefix ui playwright install --with-deps chromium

      - name: Presenter-runner contract
        run: node --test ui/scripts/console-demo-playwright.test.mjs

      - name: Live unattended browser self-test
        run: node ui/scripts/console-demo-playwright.mjs --no-pause --headless

      - name: Bounded portability proof
        run: python scripts/portability_demo.py
